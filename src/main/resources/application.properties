spring.application.name=url_shortener

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

spring.cache.type=redis

logging.level.com.jana.url_shortener.service.RedisCacheService=DEBUG
logging.level.com.jana.url_shortener.service=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Expose essential production monitoring endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

# Enable individual health indicator probes
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true
management.info.env.enabled=true

# Application Metadata for /actuator/info
info.app.name=URL Shortener Service
info.app.description=High-throughput URL shortener with Base62 encoding, Redis caching, and Bucket4j rate limiting
info.app.version=1.0.0