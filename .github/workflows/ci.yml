name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build, Verify & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository source code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 environment with Temurin
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Ensure Maven wrapper has execution permissions
      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      # 4. Compile, run Unit tests, and execute Integration tests against H2 test profile
      - name: Build with Maven and Run Tests
        run: ./mvnw clean verify -B
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: 86400000

      # 5. Verify Docker build succeeds
      - name: Verify Docker Build
        run: docker build -t url-shortener-ci:latest .